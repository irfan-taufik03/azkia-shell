# Picom configuration for BSPWM + Azkia Shell

# Enable shadows globally
shadow = true;
shadow-radius = 16;
shadow-opacity = 0.50;
shadow-offset-x = -15;
shadow-offset-y = -12;

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;

frame-opacity = 1.0;

# Prevent picom from unredirecting fullscreen transparent windows (e.g. quickshell popups)
unredir-if-possible = false;

# Animations for regular windows
animations = (
  {
    triggers = ["open"];
    preset = "appear";
    duration = 0.30;
  },
  {
    triggers = ["close"];
    preset = "disappear";
    duration = 0.30;
  },
  {
    triggers = ["geometry"];
    preset = "geometry-change";
    duration = 0.30;
  },
  {
    triggers = ["show"];
    preset = "appear";
    duration = 0.30;
    scale = 0.98;
    opacity = 0.95;
  },
  {
    triggers = ["hide"];
    preset = "disappear";
    duration = 0.30;
    scale = 0.98;
    opacity = 0.95;
  }
);

# Disable damage to prevent GLX transparent window black region artifacts
use-damage = false;

# Unified rules system for Picom v13
rules = (
  {
    # Tooltip windows: disable picom corner-radius so QML controls radius (2px)
    match = "window_type = 'tooltip'";
    shadow = false;
    fade = false;
    blur-background = false;
    full-shadow = false;
    corner-radius = 0;
  },
  {
    # Popup & dropdown menus
    match = "window_type = 'popup_menu' || window_type = 'dropdown_menu' || window_type = 'menu'";
    shadow = true;
    fade = false;
    blur-background = false;
    corner-radius = 10;
  },
  {
    # Disable shadow, animations, fades, and blur for quickshell bar and popup catcher windows
    match = "window_type = 'dock' || (y <= 10 && height <= 45) || (name != 'Settings' && (name = '' || name = 'quickshell' || width >= 1900))";
    shadow = false;
    fade = false;
    blur-background = false;
    full-shadow = false;
    animations = (
      {
        triggers = ["open", "show"];
        duration = 0;
      },
      {
        triggers = ["close", "hide"];
        duration = 0;
      },
      {
        triggers = ["geometry"];
        duration = 0;
      }
    );
  },
  {
    match = "name = 'Notification' || class_g ?= 'Notify-osd' || _GTK_FRAME_EXTENTS@";
    shadow = false;
  },
  {
    match = "fullscreen && !name *= 'quickshell' && !class_g ?= 'quickshell' && width < 1900";
    corner-radius = 15;
  }
);

# Global corner-radius for all standard windows (Settings, apps, terminals, etc.)
corner-radius = 15;

backend = "glx";
dithered-present = false;
vsync = true;
log-level = "warn";

# ==============================================================================
# Azkia Shell - Kitty Terminal Configuration
# Colorscheme: WezTerm Match (GitHub Dark #252a34 + Catppuccin Accent)
# ==============================================================================

# Font Configuration (Exact FontConfig name with ExtraBold for strong tab & terminal weight)
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font ExtraBold
italic_font      auto
bold_italic_font auto
font_size        10.5

# Window Layout & Padding
window_padding_width 12
hide_window_decorations yes
confirm_os_window_close 0
background_opacity 0.95

# Tab Bar Layout & Floating Margins
tab_bar_edge top
tab_bar_style separator
tab_separator ""
tab_bar_align left
tab_bar_margin_width 12.0
tab_bar_margin_height 10.0 0.0
tab_bar_margin_color #252a34
tab_bar_background #252a34
tab_bar_min_tabs 1

# Individual Rounded Pill Tabs (Correct cap colors + ExtraBold titles)
tab_title_template        "{fmt.fg._2f363d}{fmt.bg._252a34}{fmt.fg._d0d7de}{fmt.bg._2f363d}{fmt.bold} {title} {fmt.fg._2f363d}{fmt.bg._252a34}{fmt.bg._252a34}  "
active_tab_title_template "{fmt.fg._c6a0f6}{fmt.bg._252a34}{fmt.fg._252a34}{fmt.bg._c6a0f6}{fmt.bold} {title} {fmt.fg._c6a0f6}{fmt.bg._252a34}{fmt.bg._252a34}  "

# Color Palette - WezTerm Exact Match
background            #252a34
foreground            #d0d7de
selection_background  #415555
selection_foreground  #d0d7de
url_color             #539bf5
cursor                #58a6ff
cursor_text_color     #252a34

# Tab Bar Base Colors
active_tab_foreground   #252a34
active_tab_background   #c6a0f6
active_tab_font_style   bold
inactive_tab_foreground #d0d7de
inactive_tab_background #2f363d
inactive_tab_font_style bold

# Terminal 16-Color Palette (WezTerm GitHub Dark Palette)
# Black
color0 #2f363d
color8 #8b949e

# Red
color1 #ff7b72
color9 #ff9790

# Green
color2  #3fb950
color10 #6af28c

# Yellow
color3  #d29922
color11 #e3b341

# Blue
color4  #539bf5
color12 #79c0ff

# Magenta (Accent)
color5  #c6a0f6
color13 #d2a8ff

# Cyan
color6  #39c5cf
color14 #56d4dd

# White
color7  #d0d7de
color15 #ffffff

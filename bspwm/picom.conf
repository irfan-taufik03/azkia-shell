shadow-radius = 7;
shadow-offset-x = -7;
shadow-offset-y = -7;

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;

frame-opacity = 1.0;

# Animations for regular windows
animations = (
  {
    triggers = ["open"];
    preset = "appear";
    duration = 0.30;
  },
  {
    triggers = ["close"];
    preset = "disappear";
    duration = 0.30;
  },
  {
    triggers = ["geometry"];
    preset = "geometry-change";
    duration = 0.30;
  },
  {
    triggers = ["show"];
    preset = "appear";
    duration = 0.30;
    scale = 0.98;
    opacity = 0.95;
  },
  {
    triggers = ["hide"];
    preset = "disappear";
    duration = 0.30;
    scale = 0.98;
    opacity = 0.95;
  }
);

# Unified rules system for Picom v13
rules = (
  {
    # Exclude quickshell, menus, rofi, and override_redirect windows from picom animations, shadows, fades, and blur
    match = "class_g = 'quickshell' || class_g = 'Quickshell' || class_g = 'qs' || class_g = 'Rofi' || class_g = 'dmenu' || window_type = 'popup_menu' || window_type = 'dropdown_menu' || window_type = 'tooltip' || window_type = 'dock' || override_redirect";
    animations = (
      {
        triggers = ["open", "show"];
        duration = 0;
      },
      {
        triggers = ["close", "hide"];
        duration = 0;
      },
      {
        triggers = ["geometry"];
        duration = 0;
      }
    );
    shadow = false;
    fade = false;
    blur-background = false;
  },
  {
    match = "name = 'Notification' || class_g ?= 'Notify-osd' || _GTK_FRAME_EXTENTS@";
    shadow = false;
  },
  {
    match = "fullscreen";
    corner-radius = 12;
  }
);

corner-radius = 12;

backend = "xrender";
dithered-present = false;
vsync = true;
use-damage = true;
log-level = "warn";

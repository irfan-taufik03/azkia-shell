shell /usr/bin/fish

# ==============================================================================
# Azkia Shell - Kitty Terminal Configuration
# Colorscheme: Alacritty Match (Nord / #24273A Palette)
# ==============================================================================

# Font Configuration
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.0

# Window Layout & Padding
window_padding_width 6
hide_window_decorations yes
confirm_os_window_close 0
background_opacity 0.95

# Tab Bar Layout & Floating Margins
tab_bar_edge top
tab_bar_style separator
tab_separator ""
tab_bar_align left
tab_bar_margin_width 6.0
tab_bar_margin_height 6.0 0.0
tab_bar_margin_color #24273A
tab_bar_background #24273A
tab_bar_min_tabs 1

# Individual Rounded Pill Tabs (Original Theme Colors)
tab_title_template        "{fmt.fg._2f363d}{fmt.bg._24273A}{fmt.fg._d0d7de}{fmt.bg._2f363d}{fmt.bold} {title} {fmt.fg._2f363d}{fmt.bg._24273A}{fmt.bg._24273A}  "
active_tab_title_template "{fmt.fg._c6a0f6}{fmt.bg._24273A}{fmt.fg._252a34}{fmt.bg._c6a0f6}{fmt.bold} {title} {fmt.fg._c6a0f6}{fmt.bg._24273A}{fmt.bg._24273A}  "

# Color Palette - Alacritty Match
background            #24273A
foreground            #D8DEE9
selection_background  #4C566A
selection_foreground  #D8DEE9
url_color             #88C0D0
cursor                #D8DEE9
cursor_text_color     #24273A

# Tab Bar Base Colors
active_tab_foreground   #252a34
active_tab_background   #c6a0f6
active_tab_font_style   bold
inactive_tab_foreground #d0d7de
inactive_tab_background #2f363d
inactive_tab_font_style bold

# Terminal 16-Color Palette (Alacritty Exact Match)
# Black
color0 #3B4252
color8 #4C566A

# Red
color1 #BF616A
color9 #BF616A

# Green
color2  #A3BE8C
color10 #A3BE8C

# Yellow
color3  #EBCB8B
color11 #EBCB8B

# Blue
color4  #81A1C1
color12 #81A1C1

# Magenta
color5  #B48EAD
color13 #B48EAD

# Cyan
color6  #88C0D0
color14 #8FBCBB

# White
color7  #E5E9F0
color15 #ECEFF4
